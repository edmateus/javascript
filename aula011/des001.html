<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>
<body>
    <h1>Qual a sua nacionalidade?</h1>
    <input type="text" name="txtpais" id="txtpais">
    <input type="button" value="Checar" id="checar" onclick="conferir()">
    <div id="res">

    </div>
    <script>
        function  conferir(){
            var txtp = window.document.getElementById('txtpais')
            var res = window.document.getElementById('res')
            var pais = txtp.value.trim().toLowerCase()
            if (pais === 'brasil'){
                res.innerHTML = 'Você é Brasileiro'
            } else {
                res.innerHTML = 'Você é estrangeiro'
            }
        }
    </script>
</body>
</html>
